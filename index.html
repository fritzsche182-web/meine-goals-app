<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f8f9fb"><title>Goals</title><style>
:root{font-family:Inter,system-ui,-apple-system,Arial,sans-serif;color:#20242b;background:#f8f9fb}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid #6478ef;outline-offset:2px}.shell{max-width:860px;margin:auto;padding:30px 18px 90px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px}h1{font-size:30px;letter-spacing:-1.3px;margin:0}h2{font-size:20px;letter-spacing:-.5px;margin:0 0 16px}h3{margin:0;font-size:16px}p{color:#777f8b}.muted,small{color:#89909c;font-size:12px}.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:26px;border-bottom:1px solid #e7e9ee}.tab{border:0;background:transparent;padding:13px 15px;color:#858c97;white-space:nowrap}.tab.active{color:#252b36;border-bottom:2px solid #252b36;font-weight:700}.panel{background:#fff;border:1px solid #e9ebf0;border-radius:17px;padding:20px;margin:13px 0;box-shadow:0 2px 8px #19243a05}.between{display:flex;align-items:center;justify-content:space-between;gap:12px}.btn{background:#252b36;color:white;border:0;border-radius:10px;padding:11px 15px}.ghost{background:#f0f2f5;color:#303642}.danger{color:#bd4b50}.smallbtn{padding:7px 10px;font-size:12px}.pill{font-size:11px;background:#f1f3f6;padding:5px 8px;border-radius:8px;color:#6d7480}.row{display:flex;gap:10px;align-items:center}.stack{display:grid;gap:12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.metric{font-size:29px;font-weight:750;letter-spacing:-1px;margin-top:7px}.progress{height:7px;background:#eff0f4;border-radius:20px;overflow:hidden;margin:14px 0 5px}.fill{height:100%;background:#6678e9;border-radius:20px}.check{width:28px;height:28px;display:grid;place-items:center;border:1px solid #d8dce5;border-radius:9px;background:#fff;flex-shrink:0;color:white}.check.done{background:#6678e9;border-color:#6678e9}.item{padding:14px 0;border-top:1px solid #f0f1f4}.item:first-child{border-top:0}.itemmain{flex:1;min-width:0;cursor:pointer}.itemmain strong{display:block;overflow-wrap:anywhere}.doneText{text-decoration:line-through;color:#a1a7b0}.sub{color:#8a909a;font-size:12px;margin-top:5px}.field{display:grid;gap:6px;margin-bottom:13px}.field label{font-size:12px;font-weight:650;color:#666e7b}input,textarea,select{width:100%;border:1px solid #e1e4ea;background:white;border-radius:10px;padding:11px;color:#252b36}textarea{resize:vertical;min-height:90px}.actions{display:flex;gap:8px;flex-wrap:wrap}.hide{display:none!important}.overlay{position:fixed;inset:0;background:#10162275;display:grid;place-items:center;padding:15px;z-index:10}.modal{background:#fff;border-radius:18px;padding:22px;width:min(100%,480px);max-height:90vh;overflow:auto}.login{width:min(100%,350px);text-align:center}.empty{text-align:center;padding:30px 8px;color:#8b929d}.days{display:flex;gap:5px;margin-top:12px}.day{flex:1;text-align:center;font-size:11px;color:#8b929d}.dot{width:100%;height:28px;border-radius:7px;background:#f0f2f5;border:0;margin-top:5px;color:#6872a0}.dot.hit{background:#6678e9;color:white}.tag{font-size:11px;border:1px solid #e9ebf0;padding:4px 7px;border-radius:7px}.topline{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.link{border:0;background:none;color:#6b75d9;padding:5px}.journalEntry{white-space:pre-wrap;overflow-wrap:anywhere;color:#454b55;font-size:14px}.footer{margin-top:35px;text-align:center;color:#a1a6ae;font-size:11px}@media(max-width:540px){.shell{padding:20px 14px 75px}h1{font-size:26px}.panel{padding:16px}.grid{gap:8px}.metric{font-size:24px}.tab{padding:12px 11px;font-size:13px}}
</style></head><body><div id="root"></div><script>
const KEY='minimal-goals-v1',AUTH='minimal-goals-unlocked',PINKEY='goals-session-pin';const today=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};const weekStart=(date=new Date())=>{let d=new Date(date.getFullYear(),date.getMonth(),date.getDate());d.setDate(d.getDate()-(d.getDay()+6)%7);return d};const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;const weekDays=()=>Array.from({length:7},(_,i)=>{let d=weekStart();d.setDate(d.getDate()+i);return iso(d)});const weekKey=()=>iso(weekStart());const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random());let state={goals:[],todos:[],journal:[]};try{let s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.goals)&&Array.isArray(s.todos)&&Array.isArray(s.journal))state=s}catch{}let tab='home',modal='',editId=null,filter='all';let cloudReady=false, syncing=false, pending=false;
const cloud=async(method='GET',data)=>{const pin=sessionStorage.getItem(PINKEY);const r=await fetch('/api/data',{method,headers:{'X-Goals-Pin':pin||'','Content-Type':'application/json'},body:method==='PUT'?JSON.stringify(data):undefined,cache:'no-store'});const x=await r.json();if(!r.ok)throw Error(x.error||'Netzwerkfehler');return x};
async function connect(pin){sessionStorage.setItem(PINKEY,pin);try{const remote=await cloud();if(!remote.initialized && (state.goals.length||state.todos.length||state.journal.length)){await cloud('PUT',state)}else state=remote.data;cloudReady=true;sessionStorage.setItem(AUTH,'yes');localStorage.setItem(KEY,JSON.stringify(state));render();}catch(e){sessionStorage.removeItem(PINKEY);sessionStorage.removeItem(AUTH);alert(e.message);render()}}
const save=()=>{localStorage.setItem(KEY,JSON.stringify(state));render();pending=true;syncNow()};
async function syncNow(){if(syncing||!cloudReady)return;syncing=true;while(pending){pending=false;const snapshot=JSON.parse(JSON.stringify(state));try{await cloud('PUT',snapshot)}catch(e){pending=true;alert('Cloud-Speicherung fehlgeschlagen. Deine Änderung ist lokal gesichert. Bitte Verbindung prüfen und neu laden.');break}}syncing=false}
const goalCount=g=>weekDays().filter(d=>(g.dates||[]).includes(d)).length;const goalRate=g=>Math.min(100,Math.round(goalCount(g)/g.target*100));const taskSort=(a,b)=>Number(a.done)-Number(b.done)||({high:0,medium:1,low:2}[a.priority]-{high:0,medium:1,low:2}[b.priority])||String(a.due||'9999').localeCompare(String(b.due||'9999'));
function render(){let root=document.getElementById('root');if(sessionStorage.getItem(AUTH)!=='yes'||!cloudReady){root.innerHTML=`<div class="overlay"><div class="modal login"><h1>Goals.</h1><p>Dein persönlicher Bereich</p><form id="login"><div class="field"><input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="Zugangscode" required></div><button class="btn" style="width:100%">Öffnen</button><p id="error" class="danger" style="font-size:12px"></p></form></div></div>`;document.getElementById('login').onsubmit=e=>{e.preventDefault();connect(document.getElementById('pin').value)};return}root.innerHTML=`<div class="shell"><header><div><h1>Goals.</h1><div class="muted">${new Intl.DateTimeFormat('de-DE',{weekday:'long',day:'numeric',month:'long'}).format(new Date())}</div></div><button class="btn ghost smallbtn" onclick="lock()">Sperren</button></header><nav class="tabs">${[['home','Übersicht'],['goals','Goals'],['todos','To-dos'],['journal','Journal']].map(([k,v])=>`<button class="tab ${tab===k?'active':''}" onclick="go('${k}')">${v}</button>`).join('')}</nav><main>${tab==='home'?homeView():tab==='goals'?goalsView():tab==='todos'?todosView():journalView()}</main><div class="footer">Netlify Cloud-Speicher · Backup im Journal</div></div>${modal?modalView():''}`}
function go(t){tab=t;modal='';render()}function lock(){sessionStorage.removeItem(AUTH);sessionStorage.removeItem(PINKEY);cloudReady=false;render()}function section(title,action=''){return `<div class="between" style="margin-bottom:14px"><h2 style="margin:0">${title}</h2>${action}</div>`}function homeView(){let achieved=state.goals.filter(g=>goalCount(g)>=g.target).length;let pending=state.todos.filter(t=>!t.done).length;return `<div class="grid"><div class="panel"><div class="muted">Wochenziele erreicht</div><div class="metric">${achieved} / ${state.goals.length}</div></div><div class="panel"><div class="muted">Offene Aufgaben</div><div class="metric">${pending}</div></div></div><div class="panel">${section('Deine Goals',`<button class="link" onclick="go('goals')">Alle anzeigen →</button>`)}${state.goals.length?state.goals.slice(0,5).map(goalRow).join(''):`<div class="empty">Lege dein erstes Wochenziel an.</div>`}<button class="btn ghost smallbtn" style="margin-top:12px" onclick="openModal('goal')">+ Goal hinzufügen</button></div><div class="panel">${section('Nächste Aufgaben',`<button class="link" onclick="go('todos')">Alle anzeigen →</button>`)}${state.todos.filter(t=>!t.done).sort(taskSort).slice(0,5).map(todoRow).join('')||'<div class="empty">Alles erledigt.</div>'}<button class="btn ghost smallbtn" style="margin-top:12px" onclick="openModal('todo')">+ Aufgabe hinzufügen</button></div><div class="panel">${section('Reflexion',`<button class="link" onclick="go('journal')">Journal öffnen →</button>`)}<p>Halte fest, was heute gut lief oder was du nächste Woche anders machen möchtest.</p><button class="btn ghost smallbtn" onclick="openModal('journal')">+ Eintrag schreiben</button></div>`}
function goalsView(){return `<div class="panel">${section('Wochenziele',`<button class="btn smallbtn" onclick="openModal('goal')">+ Neues Goal</button>`)}<div class="muted">Woche ab ${new Intl.DateTimeFormat('de-DE',{day:'numeric',month:'long'}).format(weekStart())} · Tippe auf einen Tag zum Abhaken</div>${state.goals.map(goalRow).join('')||'<div class="empty">Noch keine Goals. Erstelle deine erste Routine.</div>'}</div>`}function goalRow(g){let dates=weekDays();return `<div class="item"><div class="between"><div class="itemmain" onclick="openModal('goal','${g.id}')"><strong>${esc(g.name)}</strong><div class="sub">${goalCount(g)} von ${g.target} Mal diese Woche</div></div><button class="link smallbtn" onclick="openModal('goal','${g.id}')">Bearbeiten</button></div><div class="progress"><div class="fill" style="width:${goalRate(g)}%"></div></div><div class="days">${dates.map((d,i)=>`<div class="day">${['Mo','Di','Mi','Do','Fr','Sa','So'][i]}<button aria-label="${d} ${esc(g.name)}" class="dot ${(g.dates||[]).includes(d)?'hit':''}" onclick="toggleGoal('${g.id}','${d}')">${(g.dates||[]).includes(d)?'✓':''}</button></div>`).join('')}</div></div>`}function toggleGoal(id,d){let g=state.goals.find(x=>x.id===id);if(!g)return;g.dates=g.dates||[];g.dates=g.dates.includes(d)?g.dates.filter(x=>x!==d):[...g.dates,d];save()}
function todosView(){let list=state.todos.filter(t=>filter==='all'||(filter==='open'&&!t.done)||(filter==='private'&&t.area==='Privat')||(filter==='business'&&t.area==='Business')).sort(taskSort);return `<div class="panel">${section('Aufgaben',`<button class="btn smallbtn" onclick="openModal('todo')">+ Neue Aufgabe</button>`)}<div class="row" style="flex-wrap:wrap;margin-bottom:15px">${[['all','Alle'],['open','Offen'],['private','Privat'],['business','Business']].map(([k,v])=>`<button class="btn smallbtn ${filter===k?'':'ghost'}" onclick="setFilter('${k}')">${v}</button>`).join('')}</div>${list.map(todoRow).join('')||'<div class="empty">Keine Aufgaben vorhanden.</div>'}</div>`}function setFilter(v){filter=v;render()}function todoRow(t){let pri={high:'Hoch',medium:'Mittel',low:'Niedrig'};return `<div class="item row"><button class="check ${t.done?'done':''}" onclick="toggleTodo('${t.id}')" aria-label="Erledigt">${t.done?'✓':''}</button><div class="itemmain" onclick="openModal('todo','${t.id}')"><strong class="${t.done?'doneText':''}">${esc(t.title)}</strong><div class="sub">${esc(t.area)} · ${pri[t.priority]}${t.due?' · '+esc(t.due):''}${t.description?' · Mit Beschreibung':''}</div></div><button class="link" onclick="openModal('todo','${t.id}')">›</button></div>`}function toggleTodo(id){let t=state.todos.find(x=>x.id===id);if(t){t.done=!t.done;save()}}
function journalView(){let entries=[...state.journal].sort((a,b)=>b.date.localeCompare(a.date));return `<div class="panel">${section('Journal',`<button class="btn smallbtn" onclick="openModal('journal')">+ Eintrag</button>`)}<p>Kurze Gedanken für heute oder ein Rückblick auf deine Woche.</p>${entries.map(e=>`<div class="item"><div class="between"><strong>${e.type==='week'?'Wochenrückblick':'Tagesjournal'} · ${esc(e.date)}</strong><button class="link" onclick="openModal('journal','${e.id}')">Bearbeiten</button></div><div class="journalEntry" style="margin-top:10px">${esc(e.text)}</div></div>`).join('')||'<div class="empty">Dein Journal ist noch leer.</div>'}</div><div class="panel">${section('Daten & Backup')}<div class="actions"><button class="btn ghost smallbtn" onclick="exportData()">Backup exportieren</button><button class="btn ghost smallbtn" onclick="document.getElementById('importfile').click()">Backup importieren</button><input class="hide" id="importfile" type="file" accept="application/json" onchange="importData(this)"></div><p class="muted">Daten werden online bei Netlify gespeichert und zusätzlich lokal zwischengespeichert. Exportiere gelegentlich ein Backup.</p></div>`}
function openModal(type,id=null){modal=type;editId=id;render()}function closeModal(){modal='';editId=null;render()}function modalView(){let item=editId?state[modal==='goal'?'goals':modal==='todo'?'todos':'journal'].find(x=>x.id===editId):null;let fields=modal==='goal'?`<div class="field"><label>Name der Routine</label><input name="name" required maxlength="100" value="${esc(item?.name||'')}" placeholder="z. B. Sport"></div><div class="field"><label>Wie oft pro Woche?</label><select name="target">${Array.from({length:7},(_,i)=>`<option value="${i+1}" ${(item?.target||5)===i+1?'selected':''}>${i+1}× pro Woche</option>`).join('')}</select></div>`:modal==='todo'?`<div class="field"><label>Aufgabe</label><input name="title" required maxlength="150" value="${esc(item?.title||'')}" placeholder="Was steht an?"></div><div class="field"><label>Beschreibung</label><textarea name="description" placeholder="Details und Notizen">${esc(item?.description||'')}</textarea></div><div class="grid"><div class="field"><label>Bereich</label><select name="area">${['Privat','Business'].map(v=>`<option ${item?.area===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label>Priorität</label><select name="priority">${[['medium','Mittel'],['high','Hoch'],['low','Niedrig']].map(([k,v])=>`<option value="${k}" ${item?.priority===k?'selected':''}>${v}</option>`).join('')}</select></div></div><div class="field"><label>Fällig am (optional)</label><input type="date" name="due" value="${esc(item?.due||'')}"></div>`:`<div class="field"><label>Art</label><select name="type"><option value="day" ${item?.type==='day'?'selected':''}>Tagesjournal</option><option value="week" ${item?.type==='week'?'selected':''}>Wochenrückblick</option></select></div><div class="field"><label>Datum</label><input type="date" name="date" required value="${esc(item?.date||today())}"></div><div class="field"><label>Was lief gut? Was möchtest du verbessern?</label><textarea name="text" required style="min-height:170px" placeholder="Deine Gedanken...">${esc(item?.text||'')}</textarea></div>`;return `<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="topline"><h2>${editId?'Bearbeiten':modal==='goal'?'Neues Goal':modal==='todo'?'Neue Aufgabe':'Neuer Eintrag'}</h2><button class="link" onclick="closeModal()">Schließen ✕</button></div><form id="editor" onsubmit="submitEditor(event)">${fields}<div class="between"><div>${editId?`<button type="button" class="btn ghost smallbtn danger" onclick="deleteItem()">Löschen</button>`:''}</div><div class="actions"><button type="button" class="btn ghost" onclick="closeModal()">Abbrechen</button><button class="btn">Speichern</button></div></div></form></div></div>`}
function submitEditor(e){e.preventDefault();let f=new FormData(e.target);let arr=state[modal==='goal'?'goals':modal==='todo'?'todos':'journal'];let old=arr.find(x=>x.id===editId);let data=modal==='goal'?{name:String(f.get('name')).trim(),target:Number(f.get('target')),dates:old?.dates||[]}:modal==='todo'?{title:String(f.get('title')).trim(),description:String(f.get('description')),area:String(f.get('area')),priority:String(f.get('priority')),due:String(f.get('due')),done:old?.done||false}:{type:String(f.get('type')),date:String(f.get('date')),text:String(f.get('text')).trim()};if(!Object.values(data).some(Boolean))return;if(old)Object.assign(old,data);else arr.push({id:uid(),...data});modal='';editId=null;save()}
function deleteItem(){if(!confirm('Eintrag wirklich löschen?'))return;let k=modal==='goal'?'goals':modal==='todo'?'todos':'journal';state[k]=state[k].filter(x=>x.id!==editId);closeModal();save()}
function exportData(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='goals-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function importData(input){let file=input.files?.[0];if(!file)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!Array.isArray(x.goals)||!Array.isArray(x.todos)||!Array.isArray(x.journal))throw Error();if(confirm('Aktuelle Daten durch das Backup ersetzen?')){state=x;save()}}catch{alert('Ungültige Backup-Datei')}};r.readAsText(file)}if(sessionStorage.getItem(PINKEY))connect(sessionStorage.getItem(PINKEY));else render();
</script></body></html>
